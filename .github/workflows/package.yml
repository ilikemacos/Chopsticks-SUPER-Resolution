name: Package release

# Builds the app, packages a versioned x64 zip and an MSI installer, generates
# SHA-256 checksums, and attaches them to the GitHub Release when a tag is
# pushed. install.ps1 consumes the zip; the MSI is a standalone installer.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the zip + MSI to (e.g. v0.4.0)"
        default: "v0.4.0"

permissions:
  contents: write

jobs:
  package:
    name: Package (Windows, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "stage/UniversalFrameFX"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/app/Release/UniversalFrameFX.exe $stage/
          # ufx-upscale.exe is the actual CSR file upscaler. Shipping it is what
          # makes "it upscales" true of the release, not just of the source tree.
          Copy-Item build/app/Release/ufx-upscale.exe $stage/
          # ufx-live.exe is the CSR real-time loop (capture -> upscale -> present),
          # CPU reference. It runs the same core the GPU real-time path dispatches
          # and reports the sustained per-frame cost, so the release carries a
          # runnable, measurable real-time demonstration and not just a claim.
          Copy-Item build/app/Release/ufx-live.exe $stage/
          Copy-Item README.md, LICENSE $stage/
          Copy-Item installer/uninstall.ps1 $stage/
          Copy-Item -Recurse examples $stage/examples
          Copy-Item app/upscaling/capabilities.json $stage/

      - name: Create zip + checksum
        shell: pwsh
        run: |
          $zip = "UniversalFrameFX-x64.zip"
          Compress-Archive -Path stage/UniversalFrameFX/* -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Write-Host "SHA-256: $hash"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # On a tag push, take the version from the tag. On a manual dispatch,
          # take it from the tag input so the zip/MSI and the release they attach
          # to all agree.
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME }
                 elseif ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" }
                 else { "v0.1.0" }
          $v = $tag.TrimStart("v")
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext
          wix build installer/msi/Package.wxs `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -d "StageDir=stage/UniversalFrameFX" `
            -d "ProductVersion=${{ steps.ver.outputs.version }}" `
            -o UniversalFrameFX-x64.msi
          $hash = (Get-FileHash -Algorithm SHA256 UniversalFrameFX-x64.msi).Hash.ToLower()
          "$hash  UniversalFrameFX-x64.msi" | Out-File -Encoding ascii UniversalFrameFX-x64.msi.sha256
          Write-Host "MSI SHA-256: $hash"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            UniversalFrameFX-x64.zip
            UniversalFrameFX-x64.zip.sha256
            UniversalFrameFX-x64.msi
            UniversalFrameFX-x64.msi.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the pushed tag; on a manual dispatch it is the
          # tag input, so the zip + MSI attach to the intended release even when
          # the tag was created by another workflow (e.g. wpf-app.yml).
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            UniversalFrameFX-x64.zip
            UniversalFrameFX-x64.zip.sha256
            UniversalFrameFX-x64.msi
            UniversalFrameFX-x64.msi.sha256
