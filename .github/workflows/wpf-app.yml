name: WPF app

on:
  push:
    branches: ["**"]
    paths:
      - "app-wpf/**"
      - ".github/workflows/wpf-app.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "app-wpf/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore app-wpf/UniversalFrameFX.sln

      - name: Build
        run: dotnet build app-wpf/UniversalFrameFX.sln -c Release --no-restore

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish app-wpf/src/UniversalFrameFX/UniversalFrameFX.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/UniversalFrameFX.exe dist/UniversalFrameFX.exe -Force
          (Get-FileHash dist/UniversalFrameFX.exe -Algorithm SHA256).Hash.ToLower() `
            | Out-File -Encoding ascii -NoNewline dist/UniversalFrameFX.exe.sha256
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalFrameFX-win-x64
          path: dist/*

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UniversalFrameFX.exe
            dist/UniversalFrameFX.exe.sha256
          generate_release_notes: true
